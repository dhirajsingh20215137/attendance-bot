name: Attendance Bot

permissions:
  contents: read

on:
  schedule:
    # Morning IN attempts
    - cron: "30 22 * * 1-5"   # 04:00 AM IST
    - cron: "30 23 * * 1-5"   # 05:00 AM IST
    - cron: "0 0 * * 1-5"     # 05:30 AM IST
    - cron: "30 0 * * 1-5"    # 06:00 AM IST
    - cron: "0 1 * * 1-5"     # 06:30 AM IST
    - cron: "30 1 * * 1-5"    # 07:00 AM IST
    - cron: "0 2 * * 1-5"     # 07:30 AM IST
    - cron: "30 2 * * 1-5"    # 08:00 AM IST

    # Evening OUT attempts
    - cron: "45 10 * * 1-5"   # 04:15 PM IST
    - cron: "15 11 * * 1-5"   # 04:45 PM IST
    - cron: "45 11 * * 1-5"   # 05:15 PM IST
    - cron: "15 12 * * 1-5"   # 05:45 PM IST
    - cron: "30 12 * * 1-5"   # 06:00 PM IST

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug Time
        run: |
          echo "Triggered at UTC time: $(date -u)"
          echo "Triggered at IST time: $(TZ='Asia/Kolkata' date)"
          echo "Event schedule: ${{ github.event.schedule }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        working-directory: NewProject
        run: chmod +x gradlew

      - name: Run Attendance Bot (Mode IN or OUT)
        working-directory: NewProject
        env:
          ATT_MODE: ${{ (github.event.schedule == '45 10 * * 1-5' || github.event.schedule == '15 11 * * 1-5' || github.event.schedule == '45 11 * * 1-5' || github.event.schedule == '15 12 * * 1-5' || github.event.schedule == '30 12 * * 1-5') && 'OUT' || 'IN' }}
          HRONE_USERNAME: ${{ secrets.HRONE_USERNAME }}
          HRONE_PASSWORD: ${{ secrets.HRONE_PASSWORD }}
          HRONE_COOKIE: ${{ secrets.HRONE_COOKIE }}
        run: ./gradlew bootRun
